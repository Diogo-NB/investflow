services:
  postgres:
    image: postgres:17-alpine
    container_name: investflow-db
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-investflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/keycloak/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: investflow-keycloak
    command: start-dev --import-realm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${KC_PORT:-8080}:8080'
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${DB_USER:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD:-postgres}
      WEB_APP_ORIGIN: ${WEB_APP_ORIGIN:-http://localhost:4200}
    volumes:
      - ./infra/keycloak/realms:/opt/keycloak/data/import

  floci:
    image: floci/floci:2.1.0-compat
    container_name: investflow-floci
    restart: unless-stopped
    ports:
      - '${FLOCI_PORT:-4566}:4566'
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      - ./infra/floci/init:/etc/localstack/init/ready.d
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'aws --endpoint-url http://localhost:4566 events describe-event-bus --name investflow',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
