<mat-form-field appearance="outline" class="w-full">
  <mat-label>Vencimento</mat-label>
  <input
    #dateInput
    matInput
    [matDatepicker]="calendar"
    [formControl]="control"
    [required]="required()"
    [errorStateMatcher]="errorMatcher"
    placeholder="DD/MM/AAAA"
    (dateInput)="selectDate($event.value, dateInput.value)"
    (input)="typeDate(dateInput.value)"
    (blur)="touched.set(true)"
  />
  <mat-datepicker-toggle matIconSuffix [for]="calendar" />
  <mat-datepicker #calendar [disabled]="disabled()" [startAt]="control.value" />
  <mat-hint>DD/MM/AAAA</mat-hint>
  <mat-error>{{ errors()[0]?.message }}</mat-error>
</mat-form-field>
