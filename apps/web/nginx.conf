server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Vite fingerprints these file names, so a changed file gets a new URL.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Copied from public/ without fingerprints.
  location /fonts/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # index.html names the current assets, so browsers revalidate it on every
  # load; unknown paths are client routes.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
