<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>InvestFlow</title>
    <meta
      name="description"
      content="Um espaço para suas próximas decisões de investimento."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root">
      <main
        class="mx-auto grid min-h-screen max-w-6xl content-center gap-4 px-6 sm:px-10"
      >
        <div id="authentication-loading" role="status">
          <p class="m-0 text-xl font-semibold text-fg">InvestFlow</p>
          <p class="mt-4 mb-0 text-muted">Iniciando sua sessão…</p>
        </div>
        <div id="authentication-failure" role="alert" hidden>
          <h1 class="m-0 text-2xl leading-tight font-semibold text-fg">
            Não foi possível iniciar sua sessão.
          </h1>
          <p class="mt-4 mb-6 text-muted">
            Verifique sua conexão e tente novamente.
          </p>
          <button
            type="button"
            class="min-h-11 cursor-pointer rounded-control border-0 bg-accent px-5 py-3 text-base font-medium text-accent-fg hover:bg-fg"
          >
            Tentar novamente
          </button>
        </div>
        <noscript>
          Ative o JavaScript no seu navegador para acessar o InvestFlow.
        </noscript>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
